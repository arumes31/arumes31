name: "CodeQL"

on:
  # Only the GitHub Actions language is analysed, so only workflow changes
  # can change the result; the weekly schedule rescans everything.
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/action.yml'
      - '**/action.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/action.yml'
      - '**/action.yaml'
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        languages: actions
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
